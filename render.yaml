services:
  # Backend Service
  - type: web
    name: smart-energy-backend
    env: node
    root: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: PORT
        value: 10000
    fromEnv:
      - MONGO_URI
      - JWT_SECRET

  # Frontend Static Site
  - type: static
    name: smart-energy-frontend
    env: static
    root: frontend
    buildCommand: npm install && npm run build
    publish: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-energy-backend
          property: url
